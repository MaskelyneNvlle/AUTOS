; Firmware de ESCUTA RS485 (so recebe). Projeto separado do firmware principal.
; Gravar aqui NAO altera o projeto de producao (firmware/), mas substitui o firmware que estiver na placa.
[env:escuta]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_dir = C:/pio_build/escuta
