; Firmware da PLC32 no VS Code (extensão PlatformIO).
; Os arquivos originais ficam em firmware/ (main.cpp e config.h), sem mudar de lugar.
[platformio]
src_dir = firmware
default_envs = plc32
; Caminho curto de build: o g++ do ESP32 falha no Windows com caminhos longos (OneDrive).
build_dir = C:/pio_build/auto

[env:plc32]
; Núcleo Arduino-ESP32 2.x: o ETH.begin(...) mudou de assinatura no 3.x,
; então a versão da plataforma fica travada de propósito.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; main.cpp usa Arduino.h, WiFi.h e ETH.h (já vêm no núcleo) e PubSubClient.
lib_deps =
    knolleary/PubSubClient@^2.8
    4-20ma/ModbusMaster@^2.0.1
